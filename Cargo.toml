[package]
name = "tauri-plugin-device-info"
version = "1.3.2"
authors = ["edisdev <edisdev14@gmail.com>"]
description = "A Tauri plugin to access device information."
license = "MIT"
repository = "https://github.com/edisdev/tauri-plugin-device-info"
homepage = "https://edisdev.github.io/tauri-plugin-device-info"
edition = "2021"
rust-version = "1.77.2"
readme = "README.md"
keywords = ["tauri", "tauri-plugin", "device-info", "battery", "cross-platform"]
categories = ["os", "hardware-support", "api-bindings"]
exclude = ["/examples", "/docs", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-device-info"

[dependencies]
tauri = { version = "2.12" }
serde = "1.0"
thiserror = "2"
serde_json = "1.0"
# Desktop implementations use these crates; mobile uses the native Swift/Kotlin plugin.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
sysinfo = "0.40"
local-ip-address = "0.6.13"
netdev = "0.47"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winbase", "winnt"] }
wmi = "0.18"
starship-battery = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
starship-battery = "0.12"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

# Tauri's `test` feature (the mock runtime) fails to load on Windows CI with
# STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139), so enable it only off Windows. The
# mock-based watcher tests are gated to match; the pure-logic tests still run
# on every platform.
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
